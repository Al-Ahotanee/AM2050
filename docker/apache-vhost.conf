# AM2050 same-origin Render service: static SPA at / and PHP API at /api/v1.
<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html
    ServerSignature Off
    TraceEnable Off
    Alias /api /var/www/am2050-api/public

    RewriteEngine On
    RewriteRule ^/?api(?:/.*)?$ /api/index.php [END,QSA]

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    <Directory /var/www/am2050-api/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
